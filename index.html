<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header__left">
      <p id="datetime" class="datetime"></p>
      <h1 id="greeting" class="greeting"></h1>
    </div>
    <div class="header__right">
      <button id="themeToggle" class="btn btn--icon" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
      </button>
      <button id="nameBtn" class="btn btn--outline">✏️ Set Name</button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="dashboard">

    <!-- FOCUS TIMER -->
    <section class="card" aria-label="Focus Timer">
      <h2 class="card__title">⏱ Focus Timer</h2>

      <div id="timerDisplay" class="timer__display" aria-live="polite">25:00</div>

      <div class="timer__setting">
        <label for="timerMinutes">Set minutes:</label>
        <input id="timerMinutes" type="number" min="1" max="120" value="25"
          class="input input--sm" aria-label="Timer duration" />
      </div>

      <div class="timer__controls">
        <button id="timerStart" class="btn btn--primary">▶ Start</button>
        <button id="timerStop"  class="btn btn--secondary" disabled>⏸ Stop</button>
        <button id="timerReset" class="btn btn--outline">↺ Reset</button>
      </div>

      <p id="timerStatus" class="timer__status" aria-live="polite"></p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card" aria-label="To-Do List">
      <h2 class="card__title">✅ To-Do List</h2>

      <form id="todoForm" class="row-form" autocomplete="off">
        <input id="todoInput" type="text" class="input" placeholder="Add a new task…"
          aria-label="New task" maxlength="120" />
        <button type="submit" class="btn btn--primary">Add</button>
      </form>

      <div class="todo__filters">
        <button class="btn btn--chip active" data-filter="all">All</button>
        <button class="btn btn--chip" data-filter="active">Active</button>
        <button class="btn btn--chip" data-filter="done">Done</button>
        <button id="sortBtn" class="btn btn--chip btn--sort">⇅ Sort</button>
      </div>

      <ul id="todoList" class="todo__list" aria-label="Tasks"></ul>
      <p id="todoEmpty" class="empty-msg">No tasks yet. Add one above!</p>
    </section>

    <!-- QUICK LINKS -->
    <section class="card" aria-label="Quick Links">
      <h2 class="card__title">🔗 Quick Links</h2>

      <form id="linkForm" class="link__form" autocomplete="off">
        <input id="linkName" type="text" class="input" placeholder="Name (e.g. YouTube)"
          aria-label="Link name" maxlength="30" />
        <input id="linkUrl" type="url" class="input" placeholder="URL (e.g. https://youtube.com)"
          aria-label="Link URL" />
        <button type="submit" class="btn btn--primary">Save</button>
      </form>

      <div id="linkGrid" class="link__grid" aria-label="Saved links"></div>
      <p id="linkEmpty" class="empty-msg">No links saved yet.</p>
    </section>

  </main>

  <!-- ===== NAME MODAL ===== -->
  <div id="nameModal" class="modal" role="dialog" aria-modal="true"
    aria-labelledby="modalTitle" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__box">
      <h3 id="modalTitle" class="modal__title">What's your name?</h3>
      <input id="nameInput" type="text" class="input" placeholder="Enter your name…"
        maxlength="40" aria-label="Your name" />
      <div class="modal__actions">
        <button id="nameSave"   class="btn btn--primary">Save</button>
        <button id="nameCancel" class="btn btn--outline">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
